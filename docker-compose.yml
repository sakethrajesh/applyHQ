# Local / production Compose — tuned for small images and low idle RAM.
# Usage: docker compose up --build
# Auth: paste Overleaf cookies in the web UI (POST /api/auth/cookies), or optionally
# export RESUME_OVERLEAF_COOKIES before `up` (see .env.example). No .env file required.

name: resume-overleaf

networks:
  internal:
    driver: bridge

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: resume-overleaf-api:local
    environment:
      # Optional overrides from the shell or a project-root .env used for Compose interpolation only.
      RESUME_OVERLEAF_COOKIES: ${RESUME_OVERLEAF_COOKIES:-}
      RESUME_OVERLEAF_COOKIE: ${RESUME_OVERLEAF_COOKIE:-}
      RESUME_OVERLEAF_COOKIE_FILE: ${RESUME_OVERLEAF_COOKIE_FILE:-}
      RESUME_OVERLEAF_PROJECT_ID: ${RESUME_OVERLEAF_PROJECT_ID:-}
      PYOVERLEAF_HOST: ${PYOVERLEAF_HOST:-www.overleaf.com}
    networks:
      - internal
    # No host port — API is internal-only; nginx on web proxies /api/ → api:8765
    expose:
      - "8765"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 96M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_API_BASE: /api
    image: resume-overleaf-web:local
    ports:
      - "${WEB_PORT:-8080}:8080"  # only published service; UI + /api proxy
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/cache/nginx:size=8m,mode=755,uid=101,gid=101
      - /var/log/nginx:size=4m,mode=755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M
